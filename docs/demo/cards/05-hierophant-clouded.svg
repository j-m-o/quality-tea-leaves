<text x="180" y="292" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-style="italic" fill="#E8E1CF">The mists will not part. The oracle will</text>
<text x="180" y="312" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-style="italic" fill="#E8E1CF">not speak of what it cannot see. Bring</text>
<text x="180" y="332" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-style="italic" fill="#E8E1CF">evidence, and the veil will lift.</text>
