name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python scripts/validate.py
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Demo reading
        run: python skills/quality-tea-leaves/scripts/tealeaves.py demo --out reading
      - name: Build skill zip
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: quality-tea-leaves
          path: |
            dist/quality-tea-leaves.zip
            reading/
